<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080a0f">
<title>숨은 박</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#080a0f;color:#e8eef7;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  canvas{display:block;width:100%;height:100%}
  #gear{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top));width:38px;height:38px;border:0;
    border-radius:11px;background:rgba(255,255,255,.06);color:#8496b0;font-size:18px;cursor:pointer;z-index:5}
  #gear:hover{background:rgba(255,255,255,.12)}
  #panel{position:fixed;right:12px;top:calc(58px + env(safe-area-inset-top));z-index:5;width:246px;display:none;
    background:#111621;border:1px solid #242e46;border-radius:14px;padding:15px 16px 17px}
  #panel.on{display:block}
  #panel h3{font-size:13px;font-weight:600;color:#8496b0;margin-bottom:11px;letter-spacing:.02em}
  #panel label{display:flex;justify-content:space-between;font-size:13px;color:#c3d0e2;margin-bottom:7px}
  #panel label b{color:#5ad1ff;font-variant-numeric:tabular-nums}
  #off{width:100%;height:22px;background:transparent;-webkit-appearance:none;appearance:none}
  #off::-webkit-slider-runnable-track{height:4px;border-radius:3px;background:#26304a}
  #off::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6px;
    border:0;border-radius:50%;background:#5ad1ff}
  #off::-moz-range-track{height:4px;border-radius:3px;background:#26304a}
  #off::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:#5ad1ff}
  #panel p{font-size:11.5px;line-height:1.55;color:#6b7c95;margin-top:10px}
  /* 게임 오버 + 기록 — 목록과 이름 입력은 캔버스보다 DOM 이 맞다 */
  #over{position:fixed;inset:0;z-index:4;display:none;background:rgba(8,10,15,.94);
    overflow-y:auto;overscroll-behavior:contain;padding:24px 16px 32px}
  #over.on{display:block}
  #ov{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
  .ov-head{display:flex;flex-direction:column;align-items:center;gap:4px}
  .ov-head .lbl{font-size:14px;color:#7a8ba5;font-weight:700}
  .ov-head .sc{font-size:62px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
  .ov-head .bst{font-size:14px;font-weight:700;color:#7a8ba5}
  .ov-head .bst.new{color:#ffd24a}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#1b2231;border-radius:12px;overflow:hidden}
  .stats div{background:#0f131d;padding:10px 12px;display:flex;justify-content:space-between;gap:8px}
  .stats dt{font-size:12.5px;color:#7a8ba5}
  .stats dd{font-size:13px;font-weight:700;color:#e8eef7;font-variant-numeric:tabular-nums}
  .submit{display:flex;gap:8px}
  .submit input{flex:1;min-width:0;background:#0f131d;border:1px solid #26304a;border-radius:10px;
    padding:10px 12px;color:#e8eef7;font-size:15px;font-family:inherit}
  .submit input::placeholder{color:#55657d}
  .submit button,.again{border:0;border-radius:10px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
  .submit button{padding:10px 16px;background:#1d5e7a;color:#d6f2ff;white-space:nowrap}
  .submit button:disabled{background:#182030;color:#55657d;cursor:default}
  .note{font-size:12px;color:#7a8ba5;text-align:center;min-height:16px}
  .note.warn{color:#ff8a8a}
  .tabs{display:flex;gap:6px}
  .tabs button{flex:1;padding:9px 0;border:0;border-radius:10px;background:#121722;color:#7a8ba5;
    font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer}
  .tabs button[aria-selected="true"]{background:#1b2231;color:#e8eef7}
  #list{display:flex;flex-direction:column;gap:1px;background:#1b2231;border-radius:12px;overflow:hidden;
    max-height:46vh;overflow-y:auto;overscroll-behavior:contain}
  .row{background:#0f131d;padding:9px 12px;display:grid;grid-template-columns:30px 1fr auto;
    align-items:center;gap:10px;font-size:13.5px}
  .row.mine{background:#132030}
  .row .rk{color:#55657d;font-weight:700;font-variant-numeric:tabular-nums}
  .row .nm{color:#c3d0e2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .sc{color:#e8eef7;font-weight:800;font-variant-numeric:tabular-nums}
  .row .sub{grid-column:2/4;color:#6b7c95;font-size:11.5px;font-variant-numeric:tabular-nums}
  .row.gap{display:block;background:#0b0e16;color:#55657d;text-align:center;padding:6px;font-size:11.5px}
  .empty{background:#0f131d;padding:22px 12px;text-align:center;color:#6b7c95;font-size:13px;line-height:1.6}
  .again{padding:14px;background:#5ad1ff;color:#04121a;font-size:16px}
  #gear:focus-visible,#off:focus-visible,#over button:focus-visible,#nick:focus-visible{
    outline:2px solid #5ad1ff;outline-offset:2px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button id="gear" aria-label="설정">⚙</button>
<div id="panel">
  <h3>설정</h3>
  <label>입력 오프셋 <b id="offv">0 ms</b></label>
  <input id="off" type="range" min="-100" max="100" step="1" value="0">
  <p>탭이 실제보다 <b>늦게</b> 잡히면 음수로,<br><b>빠르게</b> 잡히면 양수로 맞추세요.</p>
</div>
<div id="over" role="dialog" aria-label="게임 결과">
  <div id="ov">
    <div class="ov-head">
      <span class="lbl">게임 오버</span>
      <span class="sc" id="ovScore">0</span>
      <span class="bst" id="ovBest">최고 0</span>
    </div>
    <dl class="stats" id="ovStats"></dl>
    <div class="submit">
      <input id="nick" maxlength="12" placeholder="이름 (12자)" autocomplete="off" spellcheck="false">
      <button id="send" type="button">등록</button>
    </div>
    <p class="note" id="ovNote"></p>
    <div class="tabs" role="tablist">
      <button id="tabAll" type="button" role="tab" aria-selected="true">전체 랭킹</button>
      <button id="tabMine" type="button" role="tab" aria-selected="false">내 기록</button>
    </div>
    <div id="list"></div>
    <button class="again" id="again" type="button">다시 (스페이스)</button>
  </div>
</div>
<script>
"use strict";

/* ────────────────────────────────────────────────────────────────
   난이도 표 — 튜닝은 이 표만 고친다 (프로젝트 컨벤션)
   ──────────────────────────────────────────────────────────────── */
var DIFFS = {
  기본: {
    bpm: 100,            // 박 간격 0.6초
    duration: 45,        // 한 판 길이(초)
    perfect: 0.040,      // PERFECT 판정 ±초
    good: 0.090,         // GOOD 판정 ±초 (= 놓침 판정 시각)
    countIn: 4,          // 시작 카운트인 박 수(판정 없음)
    soundBeats: 4,       // 소리 마디 길이(항상 고정)
    // 콤보가 minCombo 이상일 때 무음 마디 길이 = beats (= 그 마디 최대 배율)
    silenceTable: [
      { minCombo: 0,  beats: 2 },
      { minCombo: 4,  beats: 4 },
      { minCombo: 8,  beats: 6 },
      { minCombo: 16, beats: 8 }
    ],
    scorePerfect: 3,
    scoreGood: 1
  }
};
var DIFF = DIFFS.기본;

/* ────────────────────────────────────────────────────────────────
   저장 어댑터: window.storage → localStorage → 메모리
   ──────────────────────────────────────────────────────────────── */
var Store = (function () {
  // stacker 에서 검증된 형태: 아티팩트 환경의 window.storage 는 비동기이고 {value} 를 준다.
  // 예전 동기 getItem/setItem 형태도 받아준다. 둘 다 없으면 localStorage → 메모리.
  var mem = {};
  var W = null;
  try { if (window.storage && window.storage.get && window.storage.set) W = window.storage; } catch (e) {}
  function local(k) { try { return localStorage.getItem(k); } catch (e) { return k in mem ? mem[k] : null; } }
  function localSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { mem[k] = v; } }
  return {
    get: function (k) {
      var key = "beat." + k;
      if (W) return Promise.resolve(W.get(key)).then(function (r) {
        return r && typeof r === "object" ? (r.value === undefined ? null : r.value) : r;
      }).catch(function () { return null; });
      try { if (window.storage && window.storage.getItem) return Promise.resolve(window.storage.getItem(key)); } catch (e) {}
      return Promise.resolve(local(key));
    },
    set: function (k, v) {
      var key = "beat." + k, val = String(v);
      if (W) { try { return Promise.resolve(W.set(key, val)).catch(function () {}); } catch (e) { return Promise.resolve(); } }
      try { if (window.storage && window.storage.setItem) { window.storage.setItem(key, val); return Promise.resolve(); } } catch (e) {}
      localSet(key, val);
      return Promise.resolve();
    },
    json: function (k, d) {
      return this.get(k).then(function (raw) {
        if (!raw) return d;
        try { var v = JSON.parse(raw); return v === null ? d : v; } catch (e) { return d; }
      });
    },
    num: function (k, d) {
      return this.get(k).then(function (raw) { var v = parseFloat(raw); return isFinite(v) ? v : d; });
    }
  };
})();

/* ────────────────────────────────────────────────────────────────
   기록 — 로컬 전체 기록 + 온라인 랭킹 (Supabase REST)

   JS 클라이언트 라이브러리 없이 fetch 만 쓴다("외부 라이브러리 없음" 컨벤션).
   아래 키는 공개용(publishable)이라 HTML 에 그대로 들어가도 된다. 실제 방어는
   서버의 RLS 정책과 CHECK 제약(점수 상한, 이름 길이)이 한다.
   네트워크가 어떤 이유로 막히든 게임과 로컬 기록은 그대로 돌아가야 한다.
   ──────────────────────────────────────────────────────────────── */
var API_URL = "https://czefdonwmxldnxefsubh.supabase.co/rest/v1/beat_scores";
var API_KEY = "sb_publishable_J7xd_-AgszYcyFJaX5qpKg_Nx-YDPzQ";
var TOP_N = 10;
var FRESH_MS = 30000;         // 이 시간 안에 받아온 것은 다시 부르지 않는다
var NET_MS = 6000;            // 응답이 없으면 "불러오는 중"에 머무르지 않고 내 기록을 보여준다
var RUNS_CAP = 500;           // 전체 기록 보관 한도

var Rec = {
  runs: [],                   // 전체 기록. 최신이 앞
  name: "",
  playerId: "",
  loaded: false,
  online: null                // { state:'loading'|'ok'|'error', rows, rank, at }
};

function apiHeaders() { return { apikey: API_KEY, Authorization: "Bearer " + API_KEY }; }
function netSignal() { try { return AbortSignal.timeout ? AbortSignal.timeout(NET_MS) : undefined; } catch (e) { return undefined; } }

function bestScore() { return Rec.runs.length ? Math.max.apply(null, Rec.runs.map(function (r) { return r.score; })) : 0; }

function recordRun(r) {
  Rec.runs.unshift({
    t: Date.now(), score: r.score, perfectRate: +r.perfectRate.toFixed(4),
    maxCombo: r.maxCombo, bestSilentRun: r.bestSilentRun, bestMult: r.bestMult,
    avgErrMs: Math.round(r.avgErrMs), miss: r.miss
  });
  if (Rec.runs.length > RUNS_CAP) Rec.runs.length = RUNS_CAP;
  Store.set("runs", JSON.stringify(Rec.runs));
}

function loadAll() {
  return Promise.all([
    Store.json("runs", []), Store.get("name"), Store.get("playerId"), Store.num("offset", 0),
    Store.num("best", 0)
  ]).then(function (v) {
    Rec.runs = Array.isArray(v[0]) ? v[0] : [];
    Rec.name = (v[1] || "").slice(0, 12);
    Rec.playerId = v[2] || "";
    if (!Rec.playerId) {
      Rec.playerId = (self.crypto && crypto.randomUUID) ? crypto.randomUUID()
                   : Date.now() + "-" + Math.random().toString(36).slice(2, 10);
      Store.set("playerId", Rec.playerId);
    }
    offsetMs = v[3];
    // 전체 기록이 생기기 전(예전 버전)에 저장된 최고 점수를 이어받는다
    G.best = Math.max(bestScore(), v[4] || 0);
    Rec.loaded = true;
    syncOffsetUI();
    loadOnline();
  });
}

/* 상위 TOP_N */
function fetchTop() {
  var q = "?select=name,score,player_id&order=score.desc,created_at.asc&limit=" + TOP_N;
  return fetch(API_URL + q, { headers: apiHeaders(), signal: netSignal() }).then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  });
}

/* 내 점수보다 높은 기록이 몇 개인지 세어 순위를 낸다 (Content-Range: "0-0/123") */
function fetchRank(score) {
  var q = "?score=gt." + score + "&select=id";
  var h = apiHeaders(); h.Prefer = "count=exact"; h.Range = "0-0";
  return fetch(API_URL + q, { headers: h, signal: netSignal() }).then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    var total = parseInt((r.headers.get("content-range") || "").split("/")[1], 10);
    return isFinite(total) ? total + 1 : null;
  });
}

function loadOnline() {
  if (!Rec.loaded) return;                       // playerId 가 준비되기 전에는 부르지 않는다
  var c = Rec.online;
  // 받아오는 중이거나 신선하면 다시 부르지 않는다. 실패한 것도 잠시 쉬었다 재시도해야
  // 렌더 → 실패 → 렌더가 무한히 도는 것을 막는다.
  if (c && (c.state === "loading" || Date.now() - c.at < FRESH_MS)) return;
  Rec.online = { state: "loading", at: Date.now() };
  var mine = bestScore();
  Promise.all([fetchTop(), mine ? fetchRank(mine).catch(function () { return null; }) : null])
    .then(function (v) { Rec.online = { state: "ok", rows: v[0], rank: v[1], at: Date.now() }; })
    .catch(function () { Rec.online = { state: "error", at: Date.now() }; })
    .then(function () { renderBoard(); });
}

/* 제출은 게임을 막지 않는다 — 실패해도 로컬 기록은 이미 저장돼 있다 */
function submitOnline(name, score) {
  var h = apiHeaders();
  h["Content-Type"] = "application/json";
  h.Prefer = "return=minimal";
  return fetch(API_URL, {
    method: "POST", headers: h, signal: netSignal(),
    body: JSON.stringify({ name: name, score: score, player_id: Rec.playerId })
  }).then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    Rec.online = null;                           // 새 기록이 보이도록 캐시를 버리고
    loadOnline();                                // 그 자리에서 다시 부른다
    return true;
  }).catch(function () { return false; });
}

/* ────────────────────────────────────────────────────────────────
   엔진 — 순수 로직. 오디오/그래픽 없음.
   시계는 바깥에서 주입한다(라이브는 AudioContext.currentTime, 리플레이는 기록된 시각).
   advanceTo() 호출 간격이 달라도 결과가 같아야 한다 = 주사율 독립.
   ──────────────────────────────────────────────────────────────── */
function silenceFor(diff, combo) {
  var n = diff.silenceTable[0].beats;
  for (var i = 0; i < diff.silenceTable.length; i++)
    if (combo >= diff.silenceTable[i].minCombo) n = diff.silenceTable[i].beats;
  return n;
}

function createEngine(diff, t0) {
  var beatDur = 60 / diff.bpm;
  var endTime = t0 + diff.duration;

  var s = {
    t0: t0, endTime: endTime, beatDur: beatDur,
    beats: [],              // 생성된 박 전부 (미판정은 항상 정확히 1개)
    time: t0 - 1e9,         // 엔진이 진행한 시각
    score: 0, combo: 0, maxCombo: 0,
    perfect: 0, good: 0, miss: 0,
    errSum: 0, errN: 0,
    silentRun: 0, bestSilentRun: 0,
    bestMult: 0,
    phase: "sound", phasePos: 0, silenceLen: 0,
    resetStruct: false, noMore: false, finished: false,
    events: []              // 표현 계층이 소비하는 판정 이벤트
  };

  function pending() {
    var b = s.beats[s.beats.length - 1];
    return b && !b.resolved ? b : null;
  }

  function genNext() {
    if (s.noMore) return;
    var last = s.beats[s.beats.length - 1];
    var time = last ? last.time + beatDur : t0;
    if (time > endTime + 1e-9) { s.noMore = true; return; }

    if (!last || s.resetStruct) {
      // 시작 또는 MISS 복귀 → 소리 마디 처음부터
      s.phase = "sound"; s.phasePos = 0; s.resetStruct = false;
    } else {
      s.phasePos++;
      var len = s.phase === "sound" ? diff.soundBeats : s.silenceLen;
      if (s.phasePos >= len) {
        s.phasePos = 0;
        if (s.phase === "sound") { s.phase = "silent"; s.silenceLen = silenceFor(diff, s.combo); }
        else { s.phase = "sound"; }
      }
    }
    var silent = s.phase === "silent";
    s.beats.push({
      i: s.beats.length, time: time, silent: silent, pos: s.phasePos,
      silenceLen: silent ? s.silenceLen : 0,
      mult: silent ? s.phasePos + 1 : 1,
      resolved: false, judge: null, err: 0, scheduled: false
    });
  }

  function resolve(b, judge, err, kind) {
    b.resolved = true; b.judge = judge; b.err = err;
    var gained = 0;
    if (judge === "MISS") {
      s.miss++; s.combo = 0; s.silentRun = 0; s.resetStruct = true;
    } else {
      gained = (judge === "PERFECT" ? diff.scorePerfect : diff.scoreGood) * b.mult;
      s.score += gained;
      s.combo++; if (s.combo > s.maxCombo) s.maxCombo = s.combo;
      if (judge === "PERFECT") s.perfect++; else s.good++;
      s.errSum += Math.abs(err); s.errN++;
      if (b.mult > s.bestMult) s.bestMult = b.mult;
      if (b.silent) { s.silentRun++; if (s.silentRun > s.bestSilentRun) s.bestSilentRun = s.silentRun; }
      else s.silentRun = 0;
    }
    s.events.push({ judge: judge, err: err, kind: kind, mult: b.mult,
                    silent: b.silent, gained: gained, score: s.score, combo: s.combo });
    genNext();
  }

  function advanceTo(t) {
    if (t <= s.time) return;
    for (;;) {
      var b = pending();
      if (!b) break;
      var deadline = b.time + diff.good;
      if (deadline <= t) { s.time = deadline; resolve(b, "MISS", null, "late"); }
      else break;
    }
    if (t > s.time) s.time = t;
    if (!pending() && (s.noMore || s.time >= endTime)) s.finished = true;
  }

  function tap(t) {
    if (s.finished) return null;
    if (t > s.time) advanceTo(t);
    if (s.finished) return null;
    var b = pending();
    if (!b) return null;

    var err = t - b.time;
    if (Math.abs(err) <= diff.good) {
      resolve(b, Math.abs(err) <= diff.perfect ? "PERFECT" : "GOOD", err, "hit");
      return s.events[s.events.length - 1];
    }
    // 빗나감: 판정 창 밖 입력
    var prev = s.beats[b.i - 1];
    var closerToPrev = prev && prev.resolved && Math.abs(t - prev.time) < Math.abs(err);
    if (closerToPrev) {
      // 같은 박에 두 번째 입력 → 그 박은 이미 판정됨. 벌점만 적용(다음 박은 살려둔다).
      s.miss++; s.combo = 0; s.silentRun = 0; s.resetStruct = true;
      s.events.push({ judge: "MISS", err: t - prev.time, kind: "double", mult: 1,
                      silent: prev.silent, gained: 0, score: s.score, combo: 0 });
      return s.events[s.events.length - 1];
    }
    resolve(b, "MISS", err, "swing");   // 다가올 박을 향해 헛스윙 → 그 박은 날아간다
    return s.events[s.events.length - 1];
  }

  return { s: s, pending: pending, advanceTo: advanceTo, tap: tap, genNext: genNext,
           start: function () { if (!s.beats.length) genNext(); } };
}

function summarize(s) {
  var hit = s.perfect + s.good;
  return {
    score: s.score,
    perfect: s.perfect, good: s.good, miss: s.miss,
    perfectRate: hit + s.miss > 0 ? s.perfect / (hit + s.miss) : 0,
    maxCombo: s.maxCombo,
    bestSilentRun: s.bestSilentRun,
    bestMult: s.bestMult,
    avgErrMs: s.errN ? (s.errSum / s.errN) * 1000 : 0,
    beats: s.beats.length
  };
}

/* ────────────────────────────────────────────────────────────────
   오디오 — 시계는 AudioContext.currentTime 하나뿐.
   박은 lookahead 스케줄러로 미리 예약한다. setTimeout 으로 박을 만들지 않는다.
   ──────────────────────────────────────────────────────────────── */
var AC = null, master = null, clockOffset = 0;
var LOOKAHEAD = 0.100, TICK = 25;

function audioInit() {
  if (AC) return;
  var C = window.AudioContext || window.webkitAudioContext;
  AC = new C();
  master = AC.createGain();
  master.gain.value = 0.9;
  master.connect(AC.destination);
}
function audioNow() { return AC ? AC.currentTime : performance.now() / 1000; }
function syncClock() { clockOffset = audioNow() - performance.now() / 1000; }
function perfToAudio(ms) { return ms / 1000 + clockOffset; }

function tone(t, freq, dur, type, vol, sweep) {
  if (!AC) return;
  var o = AC.createOscillator(), g = AC.createGain();
  o.type = type || "sine";
  o.frequency.setValueAtTime(freq, t);
  if (sweep) o.frequency.exponentialRampToValueAtTime(Math.max(30, sweep), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.02);
}
function clickAt(t, accent) {
  tone(t, accent ? 1320 : 880, accent ? 0.085 : 0.055, "square", accent ? 0.30 : 0.17);
  tone(t, accent ? 330 : 220, 0.045, "sine", accent ? 0.28 : 0.16);
}
function sfxHit(judge, mult, silent) {
  if (!AC) return;
  var t = audioNow() + 0.001;
  if (judge === "MISS") { tone(t, 180, 0.20, "sawtooth", 0.22, 60); return; }
  if (!silent) { tone(t, judge === "PERFECT" ? 1200 : 700, 0.05, "triangle", 0.12); return; }
  // 무음 성공: 배율에 비례해 피치가 오른다 (원칙 7)
  var base = 392 * Math.pow(2, (mult - 1) / 6);
  tone(t, base, judge === "PERFECT" ? 0.20 : 0.10, "triangle", 0.26, base * (judge === "PERFECT" ? 2 : 1.2));
  if (judge === "PERFECT") tone(t + 0.01, base * 1.5, 0.16, "sine", 0.13, base * 3);
}
function sfxBest() {
  if (!AC) return;
  var t = audioNow() + 0.01;
  [523, 659, 784, 1047].forEach(function (f, i) { tone(t + i * 0.07, f, 0.22, "triangle", 0.22); });
}
function sfxOver() {
  if (!AC) return;
  var t = audioNow() + 0.01;
  [440, 349, 262].forEach(function (f, i) { tone(t + i * 0.12, f, 0.32, "sine", 0.2); });
}

/* ────────────────────────────────────────────────────────────────
   화면
   ──────────────────────────────────────────────────────────────── */
var cv = document.getElementById("cv"), ctx = cv.getContext("2d");
var W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);

var reduceMotion = false;
try {
  var mq = window.matchMedia("(prefers-reduced-motion: reduce)");
  reduceMotion = mq.matches;
  mq.addEventListener ? mq.addEventListener("change", function (e) { reduceMotion = e.matches; })
                      : mq.addListener(function (e) { reduceMotion = e.matches; });
} catch (e) {}

var COL = {
  bg: "#080a0f", live: "#5ad1ff", silent: "#2a3346",
  early: "#57b8ff", late: "#ff5a5a", gold: "#ffd24a", text: "#e8eef7", sub: "#7a8ba5"
};


var fx = {
  pulse: -99,      // 마지막 소리 박 시각(오디오 시계)
  shake: 0, flash: 0, flashCol: "#fff",
  judge: null,     // {judge, err, at, mult, silent}
  parts: [],
  bestGlow: 0, bestMsg: 0
};
function spawnParts(n, power) {
  if (reduceMotion) n = Math.min(n, 6);
  for (var i = 0; i < n; i++) {
    var a = Math.random() * Math.PI * 2, sp = (1.6 + Math.random() * 2.6) * power;
    fx.parts.push({ x: 0, y: 0, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, hue: 190 + Math.random() * 60 });
  }
}

function fmtErr(err) {
  var ms = Math.round(err * 1000);
  return (ms > 0 ? "+" : "") + ms + "ms";
}

/* ────────────────────────────────────────────────────────────────
   게임 상태
   ──────────────────────────────────────────────────────────────── */
var G = {
  mode: "title",        // title | countin | play | over
  eng: null,
  t0: 0,                // 첫 판정 박의 오디오 시각
  inputs: [],           // t0 기준 상대 시각 — 리플레이 입력 기록(원칙 1)
  countIn: [],
  best: 0,                   // loadAll() 이 채운다
  beatBest: false,      // 이번 판에서 최고 기록을 넘었는가
  result: null,
  overAt: 0
};
var offsetMs = 0;            // loadAll() 이 채운다

function guardSec() { return 0.030 + Math.max(0, -offsetMs / 1000); }

var clockAlive = false;

/* 오디오 시계가 실제로 흐르기 시작한 뒤에 판을 시작한다.
   AudioContext 는 suspended 동안 currentTime 이 0에 멈춰 있고 resume() 은 비동기다.
   멈춘 시계로 t0 를 잡으면 첫 판만 카운트인이 얼어붙고 박이 통째로 틀어진다.
   state === "running" 만으로는 부족하다 — currentTime 이 두 번 다르게 읽혀야 진짜 흐르는 것이다. */
function whenClockRunning(cb) {
  if (clockAlive && AC.state === "running") { cb(); return; }
  var seen = AC.currentTime, tries = 0;
  (function poll() {
    if (AC.state !== "running") { try { AC.resume(); } catch (e) {} }
    var t = AC.currentTime;
    if (AC.state === "running" && t > seen) { clockAlive = true; cb(); return; }
    if (t < seen) seen = t;
    if (++tries > 250) { clockAlive = true; cb(); return; }   // 4초 넘게 안 깨면 그냥 간다
    setTimeout(poll, 16);
  })();
}

function startRun() {
  hideOver();
  audioInit();
  G.mode = "boot";                 // 시계가 깰 때까지는 판을 만들지 않는다
  G.eng = null; G.result = null; G.countIn = [];
  fx.judge = null; fx.parts.length = 0; fx.pulse = -99; fx.shake = 0; fx.flash = 0;
  fx.bestGlow = 0; fx.bestMsg = 0;
  whenClockRunning(beginRun);
}

function beginRun() {
  syncClock();
  var bd = 60 / DIFF.bpm;
  var lead = 0.35;
  G.t0 = audioNow() + lead + DIFF.countIn * bd;
  G.countIn = [];
  for (var i = 0; i < DIFF.countIn; i++)
    G.countIn.push({ time: G.t0 - (DIFF.countIn - i) * bd, n: DIFF.countIn - i, scheduled: false, pulsed: false });
  G.eng = createEngine(DIFF, G.t0);
  G.eng.start();
  G.inputs = [];
  G.beatBest = false;
  evCursor = 0;
  G.mode = "countin";
}

function endRun() {
  G.result = summarize(G.eng.s);
  G.mode = "over";
  G.overAt = audioNow();
  recordRun(G.result);                       // 모든 판을 전체 기록에 남긴다
  if (G.result.score > G.best) { G.best = G.result.score; Store.set("best", G.best); }
  loadOnline();                              // 내 순위가 바뀌었을 수 있다
  sfxOver();
  renderOver();
}

/* 오디오 스케줄러 + 엔진 진행 — 25ms 주기. 그리기와 분리되어 있다. */
function scheduler() {
  if (!AC || (G.mode !== "countin" && G.mode !== "play")) return;
  var now = audioNow(), horizon = now + LOOKAHEAD;

  for (var i = 0; i < G.countIn.length; i++) {
    var c = G.countIn[i];
    if (!c.scheduled && c.time <= horizon) { c.scheduled = true; clickAt(c.time, c.n === DIFF.countIn); }
  }
  var beats = G.eng.s.beats;
  for (var j = 0; j < beats.length; j++) {
    var b = beats[j];
    if (!b.scheduled && !b.silent && b.time <= horizon) { b.scheduled = true; clickAt(b.time, b.pos === 0); }
  }

  if (G.mode === "countin" && now >= G.t0 - DIFF.good) G.mode = "play";
  if (G.mode === "play") {
    G.eng.advanceTo(now - guardSec());
    drainEvents();
    if (G.eng.s.finished) { G.eng.advanceTo(G.eng.s.endTime + DIFF.good + 1); drainEvents(); endRun(); }
  }
}

var evCursor = 0;
function drainEvents() {
  var ev = G.eng.s.events;
  while (evCursor < ev.length) {
    var e = ev[evCursor++];
    fx.judge = { judge: e.judge, err: e.err, kind: e.kind, mult: e.mult, silent: e.silent, at: audioNow() };
    if (e.judge === "MISS") {
      fx.flash = 1; fx.flashCol = COL.late;
      if (!reduceMotion) fx.shake = 6;
      sfxHit("MISS", 1, e.silent);
    } else {
      var pw = e.silent ? e.mult : 1;
      if (e.judge === "PERFECT") {
        spawnParts(e.silent ? 8 + e.mult * 5 : 6, 0.7 + pw * 0.22);
        if (!reduceMotion && e.silent) fx.shake = Math.min(11, 1.5 + e.mult * 1.15);
      }
      sfxHit(e.judge, e.mult, e.silent);
    }
    if (!G.beatBest && e.score > G.best && G.best > 0) {
      G.beatBest = true; fx.bestGlow = 1; fx.bestMsg = 1; sfxBest();
    }
  }
}

/* ────────────────────────────────────────────────────────────────
   입력
   ──────────────────────────────────────────────────────────────── */
function onTapRaw(tsMs) {
  if (G.mode === "boot") return;              // 시계 깨는 중
  if (G.mode === "title") { startRun(); return; }
  if (G.mode === "over") return;              // 재시작은 "다시" 버튼 또는 스페이스
  var t = perfToAudio(tsMs) + offsetMs / 1000;
  if (G.mode === "countin") {
    if (t < G.t0 - DIFF.good) return;              // 카운트인 박은 판정하지 않는다
    G.mode = "play";                               // 첫 박을 노린 입력이면 바로 시작
  }
  if (!G.eng || G.eng.s.finished) return;
  G.inputs.push(t - G.t0);
  G.eng.tap(t);
  drainEvents();
  if (G.eng.s.finished) endRun();
}
function stamp(e) {
  var ts = e && typeof e.timeStamp === "number" ? e.timeStamp : 0;
  var now = performance.now();
  return (ts > 0 && Math.abs(now - ts) < 1000) ? ts : now;
}
window.addEventListener("pointerdown", function (e) {
  if (e.target.closest && e.target.closest("#panel,#gear,#over")) return;
  e.preventDefault(); onTapRaw(stamp(e));
}, { passive: false });
window.addEventListener("keydown", function (e) {
  if (e.repeat) return;
  if (e.target && e.target.tagName === "INPUT") {          // 이름 입력 중에는 가로채지 않는다
    if (e.code === "Enter") { e.preventDefault(); elSend.click(); }
    return;
  }
  if (e.code === "Space" || e.code === "Enter" || e.code === "ArrowUp") {
    e.preventDefault();
    if (G.mode === "over") { hideOver(); startRun(); return; }
    onTapRaw(stamp(e));
  }
});

/* 설정 */
var gear = document.getElementById("gear"), panel = document.getElementById("panel"),
    off = document.getElementById("off"), offv = document.getElementById("offv");
function syncOffsetUI() {
  off.value = String(offsetMs);
  offv.textContent = (offsetMs > 0 ? "+" : "") + offsetMs + " ms";
}
syncOffsetUI();
gear.addEventListener("click", function (e) { e.stopPropagation(); panel.classList.toggle("on"); });
off.addEventListener("input", function () {
  offsetMs = parseInt(off.value, 10) || 0;
  offv.textContent = (offsetMs > 0 ? "+" : "") + offsetMs + " ms";
  Store.set("offset", offsetMs);
});

/* ────────────────────────────────────────────────────────────────
   그리기 — 모든 움직임에 dt(60fps 환산, [0,3] 클램프)를 곱한다
   ──────────────────────────────────────────────────────────────── */
function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }

function update(dt, now) {
  var i, b;
  for (i = 0; i < G.countIn.length; i++) {
    b = G.countIn[i];
    if (!b.pulsed && b.time <= now) { b.pulsed = true; fx.pulse = b.time; fx.pulseAccent = (b.n === DIFF.countIn); }
  }
  if (G.eng) {
    var beats = G.eng.s.beats;
    for (i = 0; i < beats.length; i++) {
      b = beats[i];
      if (!b.pulsed && b.time <= now) { b.pulsed = true; if (!b.silent) { fx.pulse = b.time; fx.pulseAccent = (b.pos === 0); } }
    }
  }
  fx.shake *= Math.pow(0.86, dt);
  if (fx.shake < 0.05) fx.shake = 0;
  fx.flash *= Math.pow(0.84, dt);
  fx.bestGlow *= Math.pow(0.97, dt);
  fx.bestMsg -= dt / 110;
  if (fx.bestMsg < 0) fx.bestMsg = 0;
  for (i = fx.parts.length - 1; i >= 0; i--) {
    var p = fx.parts[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= Math.pow(0.94, dt); p.vy *= Math.pow(0.94, dt);
    p.life -= dt / 34;
    if (p.life <= 0) fx.parts.splice(i, 1);
  }
}

function draw(now) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = COL.bg;
  ctx.fillRect(0, 0, W, H);

  if (fx.shake > 0.05) {
    var a = Math.random() * Math.PI * 2;
    ctx.translate(Math.cos(a) * fx.shake, Math.sin(a) * fx.shake);
  }

  if (G.mode === "title" || G.mode === "boot") { drawTitle(); }
  else { drawPlay(now); }

  if (fx.flash > 0.02) {
    ctx.globalAlpha = fx.flash * 0.22;
    ctx.fillStyle = fx.flashCol;
    ctx.fillRect(-40, -40, W + 80, H + 80);
    ctx.globalAlpha = 1;
  }
}

function setFont(size, weight) {
  ctx.font = (weight || 700) + " " + size + "px -apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Noto Sans KR',sans-serif";
}
function centerText(txt, x, y, size, color, weight, align, maxW) {
  setFont(size, weight);
  if (maxW) {                       // 좁은 화면에서 글자가 넘치지 않게 줄인다
    var w = ctx.measureText(txt).width;
    if (w > maxW) setFont(Math.max(10, size * maxW / w), weight);
  }
  ctx.fillStyle = color;
  ctx.textAlign = align || "center";
  ctx.textBaseline = "middle";
  ctx.fillText(txt, x, y);
}

function drawTitle() {
  var cy = H * 0.42;
  var mw = W - 40, sz = Math.min(19, W * 0.048);
  centerText("숨은 박", W / 2, cy - 46, Math.min(62, W * 0.15), COL.text, 800, "center", mw);
  centerText("들리는 박에 맞춰 탭하세요.", W / 2, cy + 18, sz, COL.sub, 500, "center", mw);
  centerText("소리는 사라지지만 박은 계속됩니다.", W / 2, cy + 46, sz, COL.sub, 500, "center", mw);
  centerText("무음에서 맞힐수록 배율이 커집니다.", W / 2, cy + 74, sz, COL.live, 600, "center", mw);
  centerText("최고 " + G.best, W / 2, cy + 132, 17, COL.gold, 700);
  var blink = 0.55 + 0.45 * Math.sin(performance.now() / 380);
  ctx.globalAlpha = blink;
  centerText(G.mode === "boot" ? "소리 준비 중…" : "탭 또는 스페이스로 시작",
             W / 2, H * 0.80, Math.min(20, W * 0.05), COL.text, 600, "center", mw);
  ctx.globalAlpha = 1;
}

function drawPlay(now) {
  var s = G.eng.s;
  var pend = G.eng.pending();
  var silentNow = !!(pend && pend.silent);

  drawHud(now, s, pend);

  var cx = W / 2, cy = H * 0.52;
  var R = Math.max(54, Math.min(W * 0.27, H * 0.205));

  // 소리 박 펄스. fx.pulse 는 소리 박에서만 갱신되므로 무음 구간에는 저절로 0이 된다.
  // (마지막 소리 박을 일찍 쳐서 pending 이 이미 무음이어도 그 박의 펄스는 보여야 한다)
  var pk = 0, e = now - fx.pulse;
  if (e >= 0 && e < 0.30) pk = clamp01(e < 0.05 ? e / 0.05 : 1 - (e - 0.05) / 0.25);
  var dark = silentNow && pk < 0.02;

  // 확산 링
  if (pk > 0 && !reduceMotion) {
    var prog = clamp01((now - fx.pulse) / 0.42);
    ctx.beginPath();
    ctx.arc(cx, cy, R * (1 + prog * 0.85), 0, Math.PI * 2);
    ctx.strokeStyle = COL.live;
    ctx.globalAlpha = (1 - prog) * 0.42;
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  var accent = fx.pulseAccent ? 1.32 : 1;   // 마디 첫 박은 조금 더 크게 — 4박 구조가 눈에 보이게
  var r = R * (1 + pk * 0.155 * accent);
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  if (dark) {
    ctx.fillStyle = "#141a27";
    ctx.fill();
    ctx.strokeStyle = COL.silent; ctx.lineWidth = 2; ctx.stroke();
  } else {
    var g = ctx.createRadialGradient(cx, cy - r * 0.3, r * 0.1, cx, cy, r);
    g.addColorStop(0, "rgba(90,209,255," + (0.30 + pk * 0.55) + ")");
    g.addColorStop(1, "rgba(90,209,255,0.06)");
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = "rgba(90,209,255," + (0.5 + pk * 0.5) + ")";
    ctx.lineWidth = 2 + pk * 2.5; ctx.stroke();
  }

  if (fx.bestGlow > 0.02) {
    ctx.beginPath(); ctx.arc(cx, cy, r + 10, 0, Math.PI * 2);
    ctx.strokeStyle = COL.gold; ctx.globalAlpha = fx.bestGlow * 0.8;
    ctx.lineWidth = 3; ctx.stroke(); ctx.globalAlpha = 1;
  }

  // 파편
  for (var i = 0; i < fx.parts.length; i++) {
    var p = fx.parts[i];
    ctx.globalAlpha = clamp01(p.life);
    ctx.fillStyle = "hsl(" + p.hue + ",95%,66%)";
    ctx.fillRect(cx + p.x * 7 - 2, cy + p.y * 7 - 2, 4, 4);
  }
  ctx.globalAlpha = 1;

  // 카운트인 숫자
  if (G.mode === "countin") {
    var left = Math.max(0, Math.ceil((G.t0 - now) / (60 / DIFF.bpm)));
    centerText(left > 0 ? String(left) : "!", cx, cy, Math.round(R * 0.9), "#0a0e16", 800);
    centerText("준비", cx, cy + R + 40, 17, COL.sub, 600);
  }

  // 무음 남은 박 — 점만. 움직이지 않는다.
  if (silentNow) {
    var L = pend.silenceLen, remain = L - pend.pos;
    var gap = 17, x0 = cx - (L - 1) * gap / 2, y0 = cy + R + 34;
    for (var d = 0; d < L; d++) {
      ctx.beginPath();
      ctx.arc(x0 + d * gap, y0, 4.5, 0, Math.PI * 2);
      if (d >= pend.pos) { ctx.fillStyle = COL.live; ctx.fill(); }
      else { ctx.strokeStyle = COL.silent; ctx.lineWidth = 1.5; ctx.stroke(); }
    }
    ctx.globalAlpha = 0.8;
    centerText("무음 " + remain + "박", cx, y0 + 26, 13, COL.sub, 600);
    ctx.globalAlpha = 1;
  }

  drawJudge(now, cx, cy - R - 46);

  if (fx.bestMsg > 0) {
    ctx.globalAlpha = clamp01(fx.bestMsg * 1.6);
    centerText("최고 기록 갱신!", cx, H * 0.86, Math.min(26, W * 0.065), COL.gold, 800);
    ctx.globalAlpha = 1;
  }
}

function drawJudge(now, x, y) {
  if (!fx.judge) return;
  var age = now - fx.judge.at;
  if (age > 0.4 || age < -0.5) return;
  var a = clamp01(1 - age / 0.4);
  var j = fx.judge, label, col;
  if (j.judge === "PERFECT") { label = "PERFECT"; col = COL.gold; }
  else if (j.judge === "GOOD") { label = "GOOD"; col = "#b9c8dc"; }
  else if (j.kind === "late") { label = "놓쳤어요"; col = COL.late; }
  else if (j.kind === "double") { label = "이미 친 박이에요"; col = COL.late; }
  else { label = j.err < 0 ? "너무 빨라요" : "너무 느려요"; col = COL.late; }

  ctx.globalAlpha = a;
  var lift = (1 - a) * 12;
  centerText(label, x, y - lift, j.judge === "PERFECT" && j.silent ? Math.min(34, 22 + j.mult * 1.6) : 24, col, 800);
  if (j.err !== null && j.err !== undefined) {
    var ms = Math.round(j.err * 1000);
    centerText(fmtErr(j.err), x, y + 26 - lift, 17,
      ms === 0 ? COL.gold : ms < 0 ? COL.early : COL.late, 700);
  }
  if (j.judge !== "MISS" && j.silent && j.mult > 1) {
    centerText("×" + j.mult, x + 96, y - lift, 24, COL.live, 800);
  }
  ctx.globalAlpha = 1;
}

/* 지금 점수 바로 위에 있는 순위. 리더보드는 게임이 끝나야 보이므로
   "넘어야 할 숫자"는 플레이 중 화면에 따로 있어야 한다(원칙 6). */
function nextTarget(score) {
  var c = Rec.online;
  if (!c || c.state !== "ok" || !c.rows || !c.rows.length) return null;
  for (var i = c.rows.length - 1; i >= 0; i--)
    if (c.rows[i].score > score) return { rank: i + 1, score: c.rows[i].score };
  return null;                                  // 상위 목록을 전부 넘어섰다
}

function drawHud(now, s, pend) {
  var top = 14;
  // 남은 시간 바
  var left = clamp01((s.endTime - Math.max(now, s.t0)) / DIFF.duration);
  if (G.mode === "countin") left = 1;
  ctx.fillStyle = "#161c29";
  ctx.fillRect(0, 0, W, 5);
  ctx.fillStyle = left < 0.17 ? COL.late : COL.live;
  ctx.fillRect(0, 0, W * left, 5);

  centerText(String(s.score), 18, top + 26, 34, COL.text, 800, "left");
  centerText("최고 " + G.best, 18, top + 54, 14, s.score > G.best ? COL.gold : COL.sub, 700, "left");
  var nt = nextTarget(s.score);
  if (nt) centerText(nt.rank + "위 " + nt.score, 18, top + 76, 14, COL.live, 700, "left");

  var secs = Math.max(0, Math.ceil(s.endTime - Math.max(now, s.t0)));
  if (G.mode === "countin") secs = DIFF.duration;
  centerText(secs + "초", W - 60, top + 22, 17, COL.sub, 700, "right");

  if (s.combo > 0) {
    centerText(s.combo + " 콤보", W - 60, top + 48, 19, COL.live, 800, "right");
  }
  var mult = pend ? pend.mult : 1;
  if (mult > 1) {
    centerText("×" + mult, W - 60, top + 74, 17, COL.gold, 800, "right");
  }
}

/* ────────────────────────────────────────────────────────────────
   기록 화면 (DOM 오버레이)
   ──────────────────────────────────────────────────────────────── */
var elOver = document.getElementById("over"), elScore = document.getElementById("ovScore"),
    elBest = document.getElementById("ovBest"), elStats = document.getElementById("ovStats"),
    elNick = document.getElementById("nick"), elSend = document.getElementById("send"),
    elNote = document.getElementById("ovNote"), elList = document.getElementById("list"),
    tabAll = document.getElementById("tabAll"), tabMine = document.getElementById("tabMine"),
    elAgain = document.getElementById("again");
var scope = "all", sentThisRun = false;

function esc(t) {
  return String(t).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}
function fmtDate(t) {
  var d = new Date(t), p = function (n) { return (n < 10 ? "0" : "") + n; };
  return (d.getMonth() + 1) + "/" + d.getDate() + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}
function row(cls, rank, name, score, sub) {
  return '<div class="row ' + cls + '"><span class="rk">' + rank + '</span>' +
    '<span class="nm">' + esc(name) + '</span><span class="sc">' + score + '</span>' +
    (sub ? '<span class="sub">' + sub + '</span>' : '') + '</div>';
}

function renderBoard() {
  if (!elList) return;
  tabAll.setAttribute("aria-selected", scope === "all" ? "true" : "false");
  tabMine.setAttribute("aria-selected", scope === "me" ? "true" : "false");

  if (scope === "me") {
    if (!Rec.runs.length) { elList.innerHTML = '<div class="empty">아직 기록이 없습니다.</div>'; return; }
    var best = bestScore();
    var sum = Rec.runs.reduce(function (a, r) { return a + r.score; }, 0);
    var head = '<div class="row gap">' + Rec.runs.length + '판 · 최고 ' + best +
               ' · 평균 ' + Math.round(sum / Rec.runs.length) + '</div>';
    var bestAt = Rec.runs.findIndex(function (x) { return x.score === best; });
    elList.innerHTML = head + Rec.runs.map(function (r, i) {
      return row(i === bestAt ? "mine" : "", Rec.runs.length - i, fmtDate(r.t), r.score,
        "PERFECT " + Math.round(r.perfectRate * 100) + "% · 무음 " + r.bestSilentRun + "박 · ±" + r.avgErrMs + "ms");
    }).join("");
    return;
  }

  var c = Rec.online;
  if (!c || c.state === "loading") { elList.innerHTML = '<div class="empty">불러오는 중…</div>'; return; }
  if (c.state === "error") {
    elList.innerHTML = '<div class="empty">전체 랭킹을 불러오지 못했습니다.<br>' +
      '미리보기(아티팩트)에서는 외부 연결이 막혀 있어 <b>배포판에서만</b> 동작합니다.<br>' +
      '네트워크와 상관없이 <b>내 기록</b>은 그대로 남아 있습니다.</div>';
    return;
  }
  if (!c.rows.length) { elList.innerHTML = '<div class="empty">아직 등록된 기록이 없습니다.<br>첫 기록을 올려보세요.</div>'; return; }
  var html = c.rows.map(function (e, i) {
    return row(e.player_id === Rec.playerId ? "mine" : "", i + 1, e.name, e.score);
  }).join("");
  // 상위 목록에 내가 없으면 내 순위를 맨 아래 고정 행으로 붙인다
  var mine = bestScore();
  if (mine && c.rank && !c.rows.some(function (e) { return e.player_id === Rec.playerId; })) {
    html += '<div class="row gap">⋯</div>' + row("mine", c.rank, Rec.name || "나", mine);
  }
  elList.innerHTML = html;
}

function renderOver() {
  var r = G.result;
  if (!r) return;
  elScore.textContent = r.score;
  var isBest = r.score > 0 && r.score >= G.best;
  elBest.textContent = isBest ? "최고 기록! " + G.best : "최고 " + G.best;
  elBest.className = "bst" + (isBest ? " new" : "");
  elStats.innerHTML = [
    ["PERFECT 비율", Math.round(r.perfectRate * 100) + "%"],
    ["최장 무음 성공", r.bestSilentRun + "박"],
    ["최고 배율", "×" + r.bestMult],
    ["평균 오차", (r.avgErrMs ? r.avgErrMs.toFixed(0) : "0") + "ms"]
  ].map(function (x) { return "<div><dt>" + x[0] + "</dt><dd>" + x[1] + "</dd></div>"; }).join("");

  elNick.value = Rec.name;
  sentThisRun = false;
  elSend.disabled = r.score <= 0;
  elSend.textContent = "등록";
  elNote.textContent = r.score <= 0 ? "0점은 등록하지 않습니다." : "";
  elNote.className = "note";
  renderBoard();
  elOver.classList.add("on");
  elOver.scrollTop = 0;
}

function hideOver() { elOver.classList.remove("on"); }

tabAll.addEventListener("click", function () { scope = "all"; loadOnline(); renderBoard(); });
tabMine.addEventListener("click", function () { scope = "me"; renderBoard(); });
elAgain.addEventListener("click", function () { hideOver(); startRun(); });

elSend.addEventListener("click", function () {
  if (sentThisRun || !G.result || G.result.score <= 0) return;
  var name = (elNick.value || "").trim().slice(0, 12);
  if (!name) { elNote.textContent = "이름을 입력하세요."; elNote.className = "note warn"; elNick.focus(); return; }
  Rec.name = name;
  Store.set("name", name);
  sentThisRun = true;
  elSend.disabled = true;
  elSend.textContent = "보내는 중";
  elNote.textContent = "";
  elNote.className = "note";
  submitOnline(name, G.result.score).then(function (ok) {
    elSend.textContent = ok ? "등록됨" : "실패";
    if (!ok) {
      sentThisRun = false; elSend.disabled = false; elSend.textContent = "다시 등록";
      elNote.textContent = "전송 실패 — 미리보기에서는 외부 연결이 막힙니다. 내 기록에는 남아 있습니다.";
      elNote.className = "note warn";
    }
    if (ok) { scope = "all"; renderBoard(); }
  });
});

var lastMs = 0;
function frame(ms) {
  requestAnimationFrame(frame);
  var now = audioNow();
  var dt = lastMs ? (ms - lastMs) / (1000 / 60) : 1;
  lastMs = ms;
  dt = Math.max(0, Math.min(3, dt));
  if (G.mode === "countin" || G.mode === "play" || G.mode === "over") update(dt, now);
  draw(now);
}
resize();
requestAnimationFrame(frame);
setInterval(scheduler, TICK);
loadAll();

/* ────────────────────────────────────────────────────────────────
   자동 플레이 / 리플레이 훅 — window.__beat
   ──────────────────────────────────────────────────────────────── */
function sortedInputs(inputs) {
  return inputs.slice().sort(function (a, b) { return a - b; });
}

/* 기록된 입력만으로 게임을 재현한다 (원칙 1 검증) */
function headless(inputs, diff) {
  var d = diff || DIFF;
  var eng = createEngine(d, 0); eng.start();
  var xs = sortedInputs(inputs);
  for (var i = 0; i < xs.length; i++) { if (eng.s.finished) break; eng.tap(xs[i]); }
  eng.advanceTo(d.duration + d.good + 1);
  return summarize(eng.s);
}

/* 같은 입력을 서로 다른 진행 간격(=주사율)으로 돌려본다 */
function headlessStepped(inputs, stepSec, diff) {
  var d = diff || DIFF;
  var eng = createEngine(d, 0); eng.start();
  var xs = sortedInputs(inputs), k = 0;
  var end = d.duration + d.good + 1;
  for (var t = 0; t <= end; t += stepSec) {
    while (k < xs.length && xs[k] <= t) eng.tap(xs[k++]);
    eng.advanceTo(t);
    if (eng.s.finished) break;
  }
  while (k < xs.length) eng.tap(xs[k++]);
  eng.advanceTo(end);
  return summarize(eng.s);
}

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function gauss(rng) {
  var u, v, s;
  do { u = rng() * 2 - 1; v = rng() * 2 - 1; s = u * u + v * v; } while (s >= 1 || s === 0);
  return u * Math.sqrt(-2 * Math.log(s) / s);
}

/* 오차 σ(ms) 가우시안으로 박을 노리는 봇. 난수는 봇에만 있고 게임에는 없다. */
function bot(sigmaMs, seed, diff) {
  var d = diff || DIFF;
  var rng = mulberry32((seed >>> 0) || 1);
  var eng = createEngine(d, 0); eng.start();
  var inputs = [], safety = 0;
  while (!eng.s.finished && safety++ < 20000) {
    var b = eng.pending();
    if (!b) { eng.advanceTo(eng.s.time + eng.s.beatDur); continue; }
    var t = b.time + gauss(rng) * (sigmaMs / 1000);
    if (t <= eng.s.time) t = eng.s.time + 1e-6;
    inputs.push(t);
    eng.tap(t);
  }
  eng.advanceTo(d.duration + d.good + 1);
  return { result: summarize(eng.s), inputs: inputs };
}

window.__beat = {
  get state() {
    var s = G.eng && G.eng.s, p = G.eng && G.eng.pending();
    return {
      mode: G.mode, best: G.best, offsetMs: offsetMs, t0: G.t0,
      score: s ? s.score : 0, combo: s ? s.combo : 0,
      mult: p ? p.mult : 1, silent: !!(p && p.silent),
      silenceLen: p && p.silent ? p.silenceLen : 0,
      beatIndex: p ? p.i : -1,
      remaining: s ? Math.max(0, s.endTime - audioNow()) : DIFF.duration,
      finished: s ? s.finished : false,
      result: G.result
    };
  },
  get nextBeatTime() { var b = G.eng && G.eng.pending(); return b ? b.time : null; },
  now: function () { return audioNow(); },
  tap: function (atAudioTime) {
    if (G.mode === "boot") return null;
    if (G.mode === "title" || G.mode === "over") { startRun(); return null; }
    var t = typeof atAudioTime === "number" ? atAudioTime : audioNow();
    if (G.mode === "countin") { if (t < G.t0 - DIFF.good) return null; G.mode = "play"; }
    if (!G.eng || G.eng.s.finished) return null;
    G.inputs.push(t - G.t0);
    var ev = G.eng.tap(t);
    drainEvents();
    if (G.eng.s.finished) endRun();
    return ev;
  },
  reset: function () {                    // 시계가 깨야 시작되므로 비동기다
    startRun();
    return new Promise(function (res) {
      (function w() { if (G.mode !== "boot") return res(window.__beat.state); setTimeout(w, 8); })();
    });
  },
  inputs: function () { return G.inputs.slice(); },
  replay: headless,
  replayStepped: headlessStepped,
  bot: bot,
  DIFFS: DIFFS
};
</script>
</body>
